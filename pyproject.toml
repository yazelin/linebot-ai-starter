[project]
name = "linebot-ai-starter"
version = "0.1.0"
description = "A minimal LINE Messaging API bot with AI provider adapters."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
sdk = ["line-bot-sdk>=3,<4"]

[tool.uv]
package = false
